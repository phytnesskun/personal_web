<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" fill="none">
  <title>EMF and internal resistance</title>
  <desc>An ideal cell of emf epsilon has an internal resistance r in series with an external load R. The current arrow points from the positive long plate through the two resistances.</desc>
  <rect x="80" y="31" width="140" height="48" rx="8" fill="#72ccff" fill-opacity=".035" stroke="#72ccff" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M47 54H99M112 54H160M201 54H310V71M310 95V111H47V54" stroke="#72ccff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M99 47V61M112 40V68" stroke="#edf4ff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="160" y="45" width="41" height="18" rx="1" fill="#b29aff" fill-opacity=".12" stroke="#b29aff" stroke-width="1.8"/>
  <rect x="301" y="71" width="18" height="24" rx="1" fill="#72ccff" fill-opacity=".12" stroke="#72ccff" stroke-width="1.8"/>
  <path d="M244 30H283M276 25L283 30L276 35" stroke="#edf4ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
