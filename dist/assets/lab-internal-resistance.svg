  <text x="177" y="36" fill="#b29aff" font-family="Arial, sans-serif" font-size="17" font-style="italic">r</text>
  <text x="328" y="89" fill="#72ccff" font-family="Arial, sans-serif" font-size="17" font-style="italic">R</text>
  <text x="261" y="21" fill="#edf4ff" font-family="Arial, sans-serif" font-size="16" font-style="italic">I</text>
</svg>
