  <title id="title">Two coupled optical cavities</title>
  <desc id="desc">Light can pass between a gain ring and a loss ring. The left panel plots the frequencies of the two modes. They meet at gain-to-coupling ratio one. After that point one mode grows and the other decays, as shown in the right panel.</desc>
