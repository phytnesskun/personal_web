<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130" fill="none">
<title>Circular motion</title>
<desc>At the right of a circle velocity is upward and acceleration is inward.</desc>
<circle cx="120" cy="66" r="44" stroke="#b29aff" stroke-width="2" stroke-dasharray="4 4"/><circle cx="120" cy="66" r="3" stroke="#edf4ff" stroke-width="2" fill="#edf4ff"/><circle cx="164" cy="66" r="7" stroke="#72ccff" stroke-width="2" fill="#72ccff"/><path d="M164 66H125M133 61L125 66L133 71" stroke="#ff91af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M164 66V15M159 23L164 15L169 23" stroke="#72ccff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="177" y="28" fill="#72ccff" font-family="Arial, sans-serif" font-size="17">v</text><text x="124" y="96" fill="#ff91af" font-family="Arial, sans-serif" font-size="17">a</text><text x="228" y="54" fill="#72ccff" font-family="Arial, sans-serif" font-size="22">a = v²/r</text><text x="228" y="84" fill="#b29aff" font-family="Arial, sans-serif" font-size="18">F = mv²/r</text>
</svg>
