  <g stroke="#72ccff" stroke-opacity=".12"><path d="M35 105L31 110M64 105L60 110M93 105L89 110M122 105L118 110M151 105L147 110M180 105L176 110M209 105L205 110M238 105L234 110M267 105L263 110M296 105L292 110M325 105L321 110"/></g>
  <rect x="54" y="66" width="57" height="35" rx="3" fill="#72ccff" fill-opacity=".12" stroke="#72ccff" stroke-width="2"/>
  <path d="M61 74H104" stroke="#72ccff" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="255" y="66" width="57" height="35" rx="3" fill="#b29aff" fill-opacity=".035" stroke="#b29aff" stroke-opacity=".55" stroke-width="1.7" stroke-dasharray="4 4"/>
