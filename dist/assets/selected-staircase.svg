<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Light intensity across the array</title>
  <desc id="desc">Intensity falls with distance from the edge defect. Starting at guides 2 and 3, each pair has equal intensities when detuning equals coupling. When detuning is half the coupling, the first guide in each pair is one quarter as bright as the next. Gain and loss are held fixed.</desc>
  <rect width="400" height="330" fill="#101d30"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#edf4ff">
    <text x="16" y="26" font-size="20" fill="#edf4ff" text-anchor="start" font-weight="700">Light intensity across the array</text>
    <text x="16" y="49" font-size="15" fill="#b8c8df" text-anchor="start">Relative intensity · logarithmic scale</text>
    <line x1="64.00" y1="77.00" x2="377.00" y2="77.00" stroke="#40526d" stroke-width="1"/>
    <text x="54" y="82" font-size="14" fill="#b8c8df" text-anchor="end">1</text>
    <line x1="64.00" y1="115.00" x2="377.00" y2="115.00" stroke="#40526d" stroke-width="1"/>
    <text x="54" y="120" font-size="14" fill="#b8c8df" text-anchor="end">0.1</text>
    <line x1="64.00" y1="153.00" x2="377.00" y2="153.00" stroke="#40526d" stroke-width="1"/>
    <text x="54" y="158" font-size="14" fill="#b8c8df" text-anchor="end">0.01</text>
    <line x1="64.00" y1="191.00" x2="377.00" y2="191.00" stroke="#40526d" stroke-width="1"/>
    <text x="54" y="196" font-size="14" fill="#b8c8df" text-anchor="end">0.001</text>
    <line x1="64.00" y1="215.00" x2="64.00" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="64" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">2</text>
    <line x1="108.71" y1="215.00" x2="108.71" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="108.714" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">3</text>
    <line x1="153.43" y1="215.00" x2="153.43" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="153.429" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">4</text>
    <line x1="198.14" y1="215.00" x2="198.14" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="198.143" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">5</text>
    <line x1="242.86" y1="215.00" x2="242.86" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="242.857" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">6</text>
    <line x1="287.57" y1="215.00" x2="287.57" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="287.571" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">7</text>
    <line x1="332.29" y1="215.00" x2="332.29" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="332.286" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">8</text>
    <line x1="377.00" y1="215.00" x2="377.00" y2="220.00" stroke="#40526d" stroke-width="1"/>
    <text x="377" y="235" font-size="15" fill="#b8c8df" text-anchor="middle">9</text>
    <path d="M64.00,68.00 L64.00,63.00 L108.71,63.00 L108.71,68.00" fill="none" stroke="#b8c8df" stroke-width="1" stroke-linejoin="round"/>
    <path d="M153.43,68.00 L153.43,63.00 L198.14,63.00 L198.14,68.00" fill="none" stroke="#b8c8df" stroke-width="1" stroke-linejoin="round"/>
    <!-- Edge-localised eigenmode of a 60-site chain, normalised to guide 3. -->
    <path d="M64.00,77.00 L108.71,77.00 L153.43,120.47 L198.14,120.47 L242.86,163.94 L287.57,163.94 L332.29,207.40 L377.00,207.40" fill="none" stroke="#69d8ff" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="64.00" cy="77.00" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="108.71" cy="77.00" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="153.43" cy="120.47" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="198.14" cy="120.47" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="242.86" cy="163.94" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="287.57" cy="163.94" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="332.29" cy="207.40" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <circle cx="377.00" cy="207.40" r="3.3" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <path d="M64.00,99.88 L108.71,77.00 L153.43,123.56 L198.14,100.68 L242.86,147.24 L287.57,124.36 L332.29,170.92 L377.00,148.04" fill="none" stroke="#c1abff" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="5 3"/>
    <rect x="61.20" y="97.08" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="105.91" y="74.20" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="150.63" y="120.76" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="195.34" y="97.88" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="240.06" y="144.44" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="284.77" y="121.56" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="329.49" y="168.12" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <rect x="374.20" y="145.24" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <text x="220" y="256" font-size="15" fill="#b8c8df" text-anchor="middle">Waveguide number</text>
    <line x1="17.00" y1="276.00" x2="38.00" y2="276.00" stroke="#69d8ff" stroke-width="2.3"/>
    <circle cx="27.00" cy="276.00" r="3.2" fill="#69d8ff" stroke="none" stroke-width="0"/>
    <text x="44" y="281" font-size="15" fill="#edf4ff" text-anchor="start">Detuning = coupling</text>
    <line x1="17.00" y1="297.00" x2="38.00" y2="297.00" stroke="#c1abff" stroke-width="2.3" stroke-dasharray="5 3"/>
    <rect x="24.20" y="294.20" width="5.6" height="5.6" fill="#101d30" stroke="#c1abff" stroke-width="1.8"/>
    <text x="44" y="302" font-size="15" fill="#edf4ff" text-anchor="start">Detuning = half the coupling</text>
    <text x="16" y="324" font-size="14" fill="#b8c8df" text-anchor="start">Gain/loss = 2 × coupling. Guide 3 is scaled to 1.</text>
  </g>
</svg>
